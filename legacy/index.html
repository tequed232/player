<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>M3 Expressive Mobile App</title>
  
  <!-- Fonts & Material Symbols -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Roboto', 'sans-serif'],
          },
          colors: {
            m3: {
              primary: 'var(--md-sys-color-primary)',
              'on-primary': 'var(--md-sys-color-on-primary)',
              'primary-container': 'var(--md-sys-color-primary-container)',
              'on-primary-container': 'var(--md-sys-color-on-primary-container)',
              secondary: 'var(--md-sys-color-secondary)',
              'secondary-container': 'var(--md-sys-color-secondary-container)',
              'on-secondary-container': 'var(--md-sys-color-on-secondary-container)',
              'tertiary-container': 'var(--md-sys-color-tertiary-container)',
              'on-tertiary-container': 'var(--md-sys-color-on-tertiary-container)',
              surface: 'var(--md-sys-color-surface)',
              'surface-low': 'var(--md-sys-color-surface-container-low)',
              'surface-container': 'var(--md-sys-color-surface-container)',
              'surface-high': 'var(--md-sys-color-surface-container-high)',
              'surface-highest': 'var(--md-sys-color-surface-container-highest)',
              'on-surface': 'var(--md-sys-color-on-surface)',
              'on-surface-variant': 'var(--md-sys-color-on-surface-variant)',
              outline: 'var(--md-sys-color-outline)',
              'outline-variant': 'var(--md-sys-color-outline-variant)',
              'inverse-surface': 'var(--md-sys-color-inverse-surface)',
              'inverse-on-surface': 'var(--md-sys-color-inverse-on-surface)',
              'inverse-primary': 'var(--md-sys-color-inverse-primary)',
              error: 'var(--md-sys-color-error)',
              'error-container': 'var(--md-sys-color-error-container)',
            }
          },
          borderRadius: {
            '28': '28px',
            '20': '20px',
            '16': '16px',
            'pill': '9999px',
          }
        }
      }
    }
  </script>

  <!-- React & Framer Motion -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    /* Material 3 Expressive Tokens */
    :root {
      --md-sys-color-primary: #00391C;
      --md-sys-color-on-primary: #FEFFFE;
      --md-sys-color-primary-container: #12512E;
      --md-sys-color-on-primary-container: #FEFFFE;
      --md-sys-color-secondary: #243429;
      --md-sys-color-secondary-container: #3A4B3F;
      --md-sys-color-on-secondary-container: #FEFFFE;
      --md-sys-color-tertiary-container: #1E4D54;
      --md-sys-color-on-tertiary-container: #FEFFFF;
      --md-sys-color-surface: #F5FBF6;
      --md-sys-color-surface-container-low: #EFF5F1;
      --md-sys-color-surface-container: #EAEFEB;
      --md-sys-color-surface-container-high: #E4EAE5;
      --md-sys-color-surface-container-highest: #DEE4E0;
      --md-sys-color-on-surface: #000000;
      --md-sys-color-on-surface-variant: #141E17;
      --md-sys-color-outline: #28332B;
      --md-sys-color-outline-variant: #28332B;
      --md-sys-color-inverse-surface: #2D312E;
      --md-sys-color-inverse-on-surface: #ECF2EE;
      --md-sys-color-inverse-primary: #96D5A9;
      --md-sys-color-error: #B3261E;
      --md-sys-color-on-error: #FFFFFF;
      --md-sys-color-error-container: #F9DEDC;
      --md-sys-color-on-error-container: #410E0B;
    }

    body {
      background-color: #121212;
      font-family: 'Roboto', sans-serif;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      user-select: none;
      -webkit-user-select: none;
    }

    /* M3 Expressive Typography Tokens */
    .headline-emphasized {
      font-weight: 900;
      letter-spacing: -0.5px;
    }
    .title-emphasized {
      font-weight: 800;
    }
    .label-emphasized {
      font-weight: 700;
    }

    /* Hide scrollbar for standard app feel */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* Custom M3 Expressive Slider Style */
    input[type=range] {
      -webkit-appearance: none;
      background: transparent;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      height: 44px;
      width: 8px;
      border-radius: 4px;
      background: var(--md-sys-color-primary);
      cursor: pointer;
      margin-top: -14px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }
    input[type=range]::-webkit-slider-runnable-track {
      width: 100%;
      height: 16px;
      cursor: pointer;
      background: var(--md-sys-color-secondary-container);
      border-radius: 8px;
    }

    /* Device Viewport Dimensions: 412 x 892 dp */
    #app-viewport {
      width: 412px;
      height: 892px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
      position: relative;
      overflow: hidden;
      border-radius: 40px;
      background-color: var(--md-sys-color-surface);
    }

    .material-symbols-rounded {
      font-variation-settings: 'FILL' 1, 'wght' 600, 'GRAD' 0, 'opsz' 24;
    }
  </style>
</head>
<body>

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    const { motion, AnimatePresence } = window.Motion;

    // --- M3 Expressive Motion Springs ---
    const springTransition = {
      type: "spring",
      stiffness: 380,
      damping: 28,
      mass: 0.9
    };

    const fadeTransition = {
      duration: 0.25,
      ease: [0.2, 0.0, 0, 1.0]
    };

    // --- Initial Persistent Sample Data ---
    const DEFAULT_HISTORY = [
      {
        id: 'rec_1',
        title: '语音研讨会议要点',
        sub: '讨论关于AI算法迭代及数据标注细节。',
        date: '2026-09-18 14:30',
        images: [
          'https://images.unsplash.com/photo-1517245386807-bb43f82c33c4?w=600&auto=format&fit=crop',
          'https://images.unsplash.com/photo-1522071820081-009f0129c71c?w=600&auto=format&fit=crop',
          'https://images.unsplash.com/photo-1531403009284-440f080d1e12?w=600&auto=format&fit=crop'
        ],
        speechText: '今天我们讨论了语音识别模型在复杂噪音环境下的表现，并对比了新增的轻量化参数版本。整体准确率提升了约 14%。',
        summaryText: '1. 语音算法噪音抑制模块完成升级。\n2. 决定采用轻量化Transformer框架。\n3. 下周开展图片多模态模型联调。',
        mindmap: ['噪音抑制升级', '轻量化Transformer', '多模态联调']
      },
      {
        id: 'rec_2',
        title: '现场设备巡检记录',
        sub: '智能仪表显示正常，机房温度22℃。',
        date: '2026-09-17 09:15',
        images: [
          'https://images.unsplash.com/photo-1581092160607-ee22621dd758?w=600&auto=format&fit=crop',
          'https://images.unsplash.com/photo-1581092335397-9583fe92d232?w=600&auto=format&fit=crop'
        ],
        speechText: '机房 03 号配电柜指标正常，风扇无异响，传感器采集数据实时同步至后台系统。',
        summaryText: '1. 巡检完毕，系统运行稳定。\n2. 无隐患告警，各项数据符合标称要求。',
        mindmap: ['配电柜正常', '传感器同步', '无隐患']
      },
      {
        id: 'rec_3',
        title: '白板构思草图提炼',
        sub: '产品交互架构图与功能逻辑拆解。',
        date: '2026-09-15 16:40',
        images: [
          'https://images.unsplash.com/photo-1531403009284-440f080d1e12?w=600&auto=format&fit=crop'
        ],
        speechText: '针对 M3 Expressive 的核心理念，我们将动效、粗字体以及容器层级进行了重构，以保障移动端的交互流畅度。',
        summaryText: '1. 交互框架设计完毕。\n2. 动效采用轻微回弹弹簧参数。\n3. 色彩完全基于 dynamic theme 机制。',
        mindmap: ['M3 Expressive', '弹簧动效', '动态主题色彩']
      }
    ];

    // Main App Component
    function App() {
      // Current Screen Navigation state: 'home', 'camera', 'history', 'settings', 'screen5', 'api'
      const [currentScreen, setCurrentScreen] = useState('home');
      const [prevScreen, setPrevScreen] = useState('home');
      const [transitionType, setTransitionType] = useState('slide'); // 'slide', 'fade', 'zoom'
      
      // Dynamic Data & Persistent Storage
      const [records, setRecords] = useState(() => {
        const saved = localStorage.getItem('m3_records');
        return saved ? JSON.parse(saved) : DEFAULT_HISTORY;
      });
      const [selectedRecord, setSelectedRecord] = useState(records[0]);
      
      // Local Settings state
      const [settings, setSettings] = useState(() => {
        const saved = localStorage.getItem('m3_settings');
        return saved ? JSON.parse(saved) : {
          darkMode: false,
          audioSensitivity: 50,
          cameraClarity: 80,
          sttApi: 'https://api.v2t.ai/v1/recognize',
          i2tApi: 'https://api.img2txt.ai/v1/analyze'
        };
      });
      const [prevSettings, setPrevSettings] = useState(null);

      // Audio / Live Recording State
      const [isRecording, setIsRecording] = useState(false);
      const [sttLiveText, setSttLiveText] = useState('实时语音识别中... 点击下方的长按按钮发起对话或录音。');
      const [tertiaryText, setTertiaryText] = useState('关键要点总结：\n1. 语音转文字识别已就绪\n2. 点击此框可查看结构化思维导图\n3. 提问后可生成分支问答');
      const [qaBranches, setQaBranches] = useState([]);

      // UI Overlay / Modals
      const [expandedBox, setExpandedBox] = useState(null); // 'top', 'middle', 'detail_text'
      const [fullscreenImage, setFullscreenImage] = useState(null);
      const [snackbarMsg, setSnackbarMsg] = useState(null);
      const [dialogConfig, setDialogConfig] = useState(null); // { title, text, onConfirm }

      // Save persistent storage
      useEffect(() => {
        localStorage.setItem('m3_records', JSON.stringify(records));
      }, [records]);

      useEffect(() => {
        localStorage.setItem('m3_settings', JSON.stringify(settings));
      }, [settings]);

      // Navigation Handler with M3 transitions
      const navigateTo = (screen, type = 'slide') => {
        setPrevScreen(currentScreen);
        setTransitionType(type);
        setCurrentScreen(screen);
      };

      const showToast = (msg, canUndo = false) => {
        setSnackbarMsg({ text: msg, canUndo });
        setTimeout(() => {
          setSnackbarMsg(null);
        }, 4000);
      };

      const handleUndo = () => {
        if (prevSettings) {
          setSettings(prevSettings);
          setPrevSettings(null);
          showToast('已撤销修改');
        }
      };

      // Camera Capture Action
      const handleCapture = (capturedImageData) => {
        const newRec = {
          id: 'rec_' + Date.now(),
          title: '摄像抓拍分析 ' + new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}),
          sub: '现场拍摄并经由 AI 深度提取文字。',
          date: new Date().toISOString().slice(0, 10) + ' ' + new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}),
          images: [capturedImageData || 'https://images.unsplash.com/photo-1526374965328-7f61d4dc18c5?w=600&auto=format&fit=crop'],
          speechText: sttLiveText,
          summaryText: '1. 成功捕捉图像数据。\n2. 提取文本内容并与语音相融合。\n3. 分析结论：场景运行良好。',
          mindmap: ['抓拍成功', '文字提取', '综合分析完成']
        };
        const updated = [newRec, ...records];
        setRecords(updated);
        setSelectedRecord(newRec);
        showToast('已新建保存记录');
        navigateTo('screen5', 'zoom');
      };

      // Import Image action
      const handleImportImage = (e) => {
        const file = e.target.files && e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = (event) => {
            handleCapture(event.target.result);
          };
          reader.readAsDataURL(file);
        }
      };

      // Long press QA mode simulator
      const handleLongPressInput = () => {
        const questions = ["这个结论的依据是什么？", "如何进一步优化此项指标？", "是否需要补充其他数据源？"];
        const randomQ = questions[Math.floor(Math.random() * questions.length)];
        const newQA = {
          question: randomQ,
          answer: `[AI回答] 依据现有记录，该项指标的提升源于参数重构与 M3 规范的精准匹配。`
        };
        setQaBranches([...qaBranches, newQA]);
        showToast('进入提问模式：已新增紫框解答分支');
      };

      return (
        <div id="app-viewport" className={settings.darkMode ? 'dark' : ''}>
          <div className="w-full h-full bg-m3-surface text-m3-on-surface flex flex-col relative overflow-hidden font-sans">
            
            {/* Screen Viewport with Spring Motion Transitions */}
            <div className="flex-1 relative overflow-hidden">
              <AnimatePresence mode="wait" custom={transitionType}>
                
                {/* 1. 主页 (HOME SCREEN) */}
                {currentScreen === 'home' && (
                  <motion.div 
                    key="home"
                    initial={transitionType === 'slide' ? { x: 380, opacity: 0.8 } : { opacity: 0 }}
                    animate={{ x: 0, opacity: 1 }}
                    exit={transitionType === 'slide' ? { x: -380, opacity: 0.8 } : { opacity: 0 }}
                    transition={springTransition}
                    className="absolute inset-0 p-4 flex flex-col justify-between overflow-y-auto no-scrollbar"
                  >
                    <div className="flex flex-col items-center gap-3">
                      
                      {/* 上部容器框: 380x216dp */}
                      <motion.div 
                        whileTap={{ scale: 0.98 }}
                        onClick={() => setExpandedBox('top')}
                        className="w-[380px] h-[216px] bg-m3-surface-high rounded-28 p-5 cursor-pointer flex flex-col justify-between shadow-sm border border-m3-outline/10 relative overflow-hidden"
                      >
                        <div className="flex items-center justify-between text-m3-primary">
                          <div className="flex items-center gap-2">
                            <span className="material-symbols-rounded">graphic_eq</span>
                            <span className="text-sm font-bold tracking-wide">语音识别 (STT)</span>
                          </div>
                          <span className="text-xs bg-m3-primary-container text-m3-on-primary-container px-2 py-0.5 rounded-pill font-medium">点击展开面板</span>
                        </div>
                        <p className="text-m3-on-surface text-sm line-clamp-5 leading-relaxed">
                          {sttLiveText}
                        </p>
                        <div className="text-xs text-m3-on-surface-variant/70 text-right">
                          单击全屏展开
                        </div>
                      </motion.div>

                      {/* 中部分割线 */}
                      <div className="w-full px-4 my-1">
                        <div className="w-full h-[1px] bg-m3-outline-variant/30"></div>
                      </div>

                      {/* 中部容器框: 380x424dp */}
                      <motion.div 
                        whileTap={{ scale: 0.98 }}
                        onClick={() => setExpandedBox('middle')}
                        className="w-[380px] h-[424px] bg-m3-tertiary-container text-m3-on-tertiary-container rounded-28 p-5 cursor-pointer flex flex-col justify-between shadow-md relative overflow-hidden"
                      >
                        <div className="flex items-center justify-between">
                          <div className="flex items-center gap-2">
                            <span className="material-symbols-rounded">psychology</span>
                            <span className="text-base title-emphasized">智能多模态总结 & MindMap</span>
                          </div>
                          <span className="material-symbols-rounded text-sm">open_in_full</span>
                        </div>

                        <div className="my-2 flex-1 overflow-y-auto no-scrollbar space-y-3">
                          <div className="bg-black/10 p-3 rounded-20 text-xs whitespace-pre-line leading-relaxed">
                            {tertiaryText}
                          </div>

                          {/* QA Branches (Purple Cards) */}
                          {qaBranches.length > 0 && (
                            <div className="space-y-2 mt-2">
                              <span className="text-xs font-bold text-purple-200">问答分支延伸：</span>
                              {qaBranches.map((item, idx) => (
                                <div key={idx} className="bg-purple-900/40 border border-purple-400/40 p-3 rounded-20 text-xs space-y-1">
                                  <div className="font-bold text-purple-200">Q: {item.question}</div>
                                  <div className="text-purple-100">{item.answer}</div>
                                </div>
                              ))}
                            </div>
                          )}
                        </div>

                        <div className="text-xs text-purple-100/70 text-center bg-black/20 py-1.5 rounded-pill">
                          点击弹簧放大至全屏面板及思维导图
                        </div>
                      </motion.div>
                    </div>

                    {/* 下部控件区域: 覆盖层级结构 */}
                    <div className="relative w-full flex flex-col items-center gap-3 mt-2">
                      
                      {/* 长按输入文本 描边文本框 (部分覆盖在按钮组之上) */}
                      <div className="w-[380px] relative z-10">
                        <div 
                          onMouseDown={handleLongPressInput}
                          className="w-full h-[56px] border-2 border-m3-outline rounded-16 bg-m3-surface flex items-center px-4 gap-3 shadow-sm hover:border-m3-primary transition-colors cursor-pointer"
                        >
                          <span className="material-symbols-rounded text-m3-primary">voice_selection</span>
                          <span className="text-m3-on-surface-variant/80 text-sm font-medium flex-1">长按输入文本 (长按提问)</span>
                          <span className="material-symbols-rounded text-m3-outline text-sm">mic</span>
                        </div>
                      </div>

                      {/* 按钮组: 横向相连 (Connected button group) */}
                      <div className="w-[380px] flex items-center justify-center -mt-5 pt-4 bg-m3-surface/80 backdrop-blur-sm rounded-pill pb-1">
                        <div className="inline-flex gap-[3px] w-full max-w-[360px]">
                          {/* 拍照 */}
                          <motion.button 
                            whileTap={{ scale: 0.95 }}
                            onClick={() => navigateTo('camera', 'zoom')}
                            className="flex-1 h-[56px] bg-m3-primary text-m3-on-primary rounded-l-pill rounded-r-[8px] font-bold text-sm flex items-center justify-center gap-2 shadow-sm"
                          >
                            <span className="material-symbols-rounded">photo_camera</span>
                            拍照
                          </motion.button>

                          {/* 无标签 (导入图片) */}
                          <label className="flex-1 h-[56px] bg-m3-secondary-container text-m3-on-secondary-container rounded-r-pill rounded-l-[8px] font-bold text-sm flex items-center justify-center gap-2 shadow-sm cursor-pointer">
                            <span className="material-symbols-rounded">image</span>
                            无标签
                            <input type="file" accept="image/*" className="hidden" onChange={handleImportImage} />
                          </label>
                        </div>
                      </div>
                    </div>
                  </motion.div>
                )}

                {/* 2. 摄像屏幕 (CAMERA SCREEN) */}
                {currentScreen === 'camera' && (
                  <motion.div 
                    key="camera"
                    initial={{ scale: 0.85, opacity: 0 }}
                    animate={{ scale: 1, opacity: 1 }}
                    exit={{ scale: 0.85, opacity: 0 }}
                    transition={springTransition}
                    className="absolute inset-0 p-4 flex flex-col justify-between"
                  >
                    <div className="relative w-full flex-1 flex flex-col items-center justify-center">
                      
                      {/* 380x564dp 相机预览 */}
                      <div className="w-[380px] h-[564px] bg-m3-inverse-surface rounded-20 relative overflow-hidden shadow-xl flex flex-col items-center justify-center">
                        <CameraPreviewSimulator onCapture={handleCapture} />

                        {/* 中部靠左放置“返回”的填充按钮 */}
                        <motion.button 
                          whileTap={{ scale: 0.9 }}
                          onClick={() => navigateTo('home', 'fade')}
                          className="absolute top-4 left-4 h-[48px] px-4 bg-m3-primary text-m3-on-primary rounded-pill flex items-center gap-2 shadow-md z-20"
                        >
                          <span className="material-symbols-rounded">arrow_back</span>
                          <span className="text-sm font-bold">返回</span>
                        </motion.button>
                      </div>

                      {/* 中部放置标签为“标签”的描边文本输入框 */}
                      <div className="w-[380px] mt-4">
                        <div className="w-full h-[56px] border border-m3-outline rounded-16 bg-m3-surface flex items-center px-4 gap-3 shadow-sm">
                          <span className="material-symbols-rounded text-m3-on-surface-variant">search</span>
                          <input 
                            type="text" 
                            placeholder="标签" 
                            className="bg-transparent text-m3-on-surface placeholder:text-m3-on-surface-variant/60 outline-none w-full text-sm"
                          />
                        </div>
                      </div>
                    </div>
                  </motion.div>
                )}

                {/* 3. 历史屏幕 (HISTORY SCREEN) */}
                {currentScreen === 'history' && (
                  <motion.div 
                    key="history"
                    initial={transitionType === 'slide' ? { x: 380, opacity: 0.8 } : { opacity: 0 }}
                    animate={{ x: 0, opacity: 1 }}
                    exit={transitionType === 'slide' ? { x: -380, opacity: 0.8 } : { opacity: 0 }}
                    transition={springTransition}
                    className="absolute inset-0 flex flex-col justify-between"
                  >
                    {/* 顶部应用栏: 64dp */}

                        </div>
                      )}

                      {expandedBox === 'detail_text' && selectedRecord && (
                        <div className="space-y-3">
                          <div className="bg-m3-surface p-4 rounded-20">
                            <div className="font-bold text-m3-primary mb-1">语音文本:</div>
                            {selectedRecord.speechText}
                          </div>
                          <div className="bg-m3-surface p-4 rounded-20">
                            <div className="font-bold text-m3-primary mb-1">图片总结:</div>
                            {selectedRecord.summaryText}
                          </div>
                        </div>
                      )}
                    </div>
                  </div>

                  <button 
                    onClick={() => setExpandedBox(null)}
                    className="w-full h-[56px] bg-m3-primary text-m3-on-primary rounded-pill font-bold text-sm mt-4 shadow-md"
                  >
                    点击收起并复位
                  </button>
                </motion.div>
              )}
            </AnimatePresence>

            {/* 图片全屏查看器 (Carousel Fullscreen Viewer) */}
            <AnimatePresence>
              {fullscreenImage && (
                <motion.div 
                  initial={{ opacity: 0 }}
                  animate={{ opacity: 1 }}
                  exit={{ opacity: 0 }}
                  className="absolute inset-0 bg-black z-50 flex flex-col justify-between p-4"
                >
                  <div className="flex justify-end">
                    <button 
                      onClick={() => setFullscreenImage(null)}
                      className="w-[48px] h-[48px] bg-white/20 text-white rounded-full flex items-center justify-center"
                    >
                      <span className="material-symbols-rounded">close</span>
                    </button>
                  </div>

                  <div className="flex-1 flex items-center justify-center">
                    <img src={fullscreenImage} alt="" className="max-w-full max-h-[600px] object-contain rounded-20" />
                  </div>

                  <div className="text-center text-white/70 text-xs py-2">
                    左右滑动或下滑点击关闭收起
                  </div>
                </motion.div>
              )}
            </AnimatePresence>

            {/* M3 警告对话框 (Dialogs: 圆角 28dp) */}
            <AnimatePresence>
              {dialogConfig && (
                <div className="absolute inset-0 bg-black/50 z-50 flex items-center justify-center p-6 backdrop-blur-xs">
                  <motion.div 
                    initial={{ scale: 0.85, opacity: 0 }}
                    animate={{ scale: 1, opacity: 1 }}
                    exit={{ scale: 0.85, opacity: 0 }}
                    transition={springTransition}
                    className="bg-m3-surface rounded-28 p-6 w-full max-w-[340px] shadow-2xl space-y-4"
                  >
                    <h3 className="text-lg font-bold text-m3-on-surface">{dialogConfig.title}</h3>
                    <p className="text-xs text-m3-on-surface-variant leading-relaxed">{dialogConfig.text}</p>
                    
                    <div className="flex justify-end gap-2 pt-2">
                      <button 
                        onClick={() => setDialogConfig(null)}
                        className="px-4 h-[40px] text-m3-primary font-bold text-xs rounded-pill hover:bg-m3-surface-high"
                      >
                        取消
                      </button>
                      <button 
                        onClick={() => {
                          dialogConfig.onConfirm();
                          setDialogConfig(null);
                        }}
                        className="px-4 h-[40px] bg-m3-error text-m3-on-error font-bold text-xs rounded-pill shadow-sm"
                      >
                        确认
                      </button>
                    </div>
                  </motion.div>
                </div>
              )}
            </AnimatePresence>

          </div>
        </div>
      );
    }

    // Camera Preview Simulator with Real Webcam fallback
    function CameraPreviewSimulator({ onCapture }) {
      const videoRef = useRef(null);
      const [hasCamera, setHasCamera] = useState(false);

      useEffect(() => {
        async function setupCamera() {
          try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: true });
            if (videoRef.current) {
              videoRef.current.srcObject = stream;
              setHasCamera(true);
            }
          } catch (e) {
            setHasCamera(false);
          }
        }
        setupCamera();
      }, []);

      const takePhoto = () => {
        if (hasCamera && videoRef.current) {
          const canvas = document.createElement('canvas');
          canvas.width = 380;
          canvas.height = 564;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(videoRef.current, 0, 0, 380, 564);
          onCapture(canvas.toDataURL('image/jpeg'));
        } else {
          // Simulated fallback snapshot
          onCapture('https://images.unsplash.com/photo-1526374965328-7f61d4dc18c5?w=600&auto=format&fit=crop');
        }
      };

      return (
        <div className="w-full h-full relative flex items-center justify-center">
          {hasCamera ? (
            <video ref={videoRef} autoPlay playsInline className="w-full h-full object-cover" />
          ) : (
            <div className="flex flex-col items-center gap-2 text-m3-inverse-on-surface">
              <span className="material-symbols-rounded text-6xl opacity-60">photo_camera</span>
              <span className="text-xs">未检测到可用摄像头 (正在运行模拟预览)</span>
            </div>
          )}

          {/* 快门拍照按钮 */}
          <motion.button 
            whileTap={{ scale: 0.9 }}
            onClick={takePhoto}
            className="absolute bottom-6 w-[72px] h-[72px] rounded-full border-4 border-white bg-m3-primary/80 flex items-center justify-center shadow-lg z-20"
          >
            <div className="w-[52px] h-[52px] rounded-full bg-white"></div>
          </motion.button>
        </div>
      );
    }

    // Render React App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
